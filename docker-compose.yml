# ============================================
# FinPilot AI — Docker Compose
# MongoDB + Redis for local development
# ============================================
# Usage:
#   docker-compose up -d        # Start services
#   docker-compose down         # Stop services
#   docker-compose down -v      # Stop and remove volumes
# ============================================

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: finpilot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=finpilot
    networks:
      - finpilot-network

  redis:
    image: redis:7-alpine
    container_name: finpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - finpilot-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  finpilot-network:
    driver: bridge
